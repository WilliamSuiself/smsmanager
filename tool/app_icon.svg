<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 背景：深蓝 → 藏蓝渐变（专业工具感） -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#0F2540"/>
    </linearGradient>
    <!-- 气泡：亮蓝白渐变 -->
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE9F5"/>
    </linearGradient>
    <!-- 星标：金色渐变 -->
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景（自适应图标安全区外扩） -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 微弱网格点阵：汇聚/分析的数据感 -->
  <g fill="#FFFFFF" opacity="0.05">
    <circle cx="72" cy="72" r="8"/><circle cx="256" cy="56" r="8"/><circle cx="440" cy="72" r="8"/>
    <circle cx="56" cy="256" r="8"/><circle cx="456" cy="256" r="8"/>
    <circle cx="72" cy="440" r="8"/><circle cx="256" cy="456" r="8"/>
  </g>

  <!-- 主对话气泡（圆角矩形 + 左下尾巴） -->
  <g>
    <rect x="104" y="128" width="280" height="200" rx="48" fill="url(#bubble)"/>
    <path d="M150 316 L150 372 L214 322 Z" fill="#DCE9F5"/>
    <!-- 气泡内三条消息横线（渐短：汇聚多条短信） -->
    <rect x="152" y="172" width="184" height="26" rx="13" fill="#3B6FA8"/>
    <rect x="152" y="216" width="140" height="26" rx="13" fill="#5B8BC0"/>
    <rect x="152" y="260" width="96" height="26" rx="13" fill="#8FB4D9"/>
  </g>

  <!-- 副气泡（右上，多来源汇聚感） -->
  <rect x="330" y="96" width="96" height="76" rx="26" fill="#8FB4D9" opacity="0.9"/>
  <path d="M348 168 L348 200 L382 172 Z" fill="#8FB4D9" opacity="0.9"/>
  <rect x="348" y="118" width="60" height="12" rx="6" fill="#1E3A5F" opacity="0.5"/>
  <rect x="348" y="140" width="40" height="12" rx="6" fill="#1E3A5F" opacity="0.35"/>

  <!-- 金色星标：重点关注 -->
  <g transform="translate(368,340)">
    <circle r="72" fill="#0F2540"/>
    <circle r="64" fill="url(#star)"/>
    <!-- 五角星 -->
    <path fill="#FFFFFF" transform="translate(0,4)" d="M0,-38 L11.2,-11.8 L39.6,-11.8 L17.4,5.6 L26.2,32.2 L0,16 L-26.2,32.2 L-17.4,5.6 L-39.6,-11.8 L-11.2,-11.8 Z"/>
  </g>
</svg>
